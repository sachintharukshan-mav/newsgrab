name: Scheduled News Ingestion

on:
  schedule:
    # Runs every 15 minutes (24/7 without paid servers)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NewsGrab Ingestion Endpoint
        run: |
          curl -X GET "https://${{ secrets.DEPLOYED_SITE_URL }}/api/cron/scrape" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --retry 3 \
            --connect-timeout 10
